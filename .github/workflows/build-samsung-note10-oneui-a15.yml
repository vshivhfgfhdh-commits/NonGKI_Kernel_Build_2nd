name: buildA127.yml

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_a12s"
  DEVICE_CODENAME : "a12s"

  # Kernel Makefile has CC=clang, -Werror and -no-integrated-as -> old clang + GNU binutils are needed.
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  # Same variables as in the author's build_kernel.sh (do NOT add LLVM=1 / LLVM_IAS=1 here).
  EXTRA_CMDS : "ANDROID_MAJOR_VERSION=t PLATFORM_VERSION=13"

  KERNEL_SOURCE : "https://github.com/vshivhfgfhdh-commits/kernel_samsung_a12.git"
  KERNEL_BRANCH : "main"

  CLANG_SOURCE : "https://github.com/ZyCromerZ/Clang/releases/download/10.0.1-20220724-release/Clang-10.0.1-20220724.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "exynos850-a12snsxx_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh"
  KERNELSU_BRANCH : "dev-susfs"

  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "" # xxksu, rsuntk , next, bakasu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : false # first run: stock susfs_patch_to_4.19.patch from the builder

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oneui_a13"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # AnyKernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into AnyKernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "" # only needed if SUSFS_FIXED is true
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only AnyKernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "true" # Output build errors (stops at the first failure and uploads the error files).
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Samsung Galaxy A12s (SM-A127F)
    runs-on: ubuntu-24.04 # u can changed to ubuntu 22.04 if old clang fails to start
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      # Samsung kernel needs these in the environment (see build_kernel.sh of the kernel)
      ANDROID_MAJOR_VERSION: "t"
      PLATFORM_VERSION: "13"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: ❗ A12s Kernel Pack Process (AnyKernel3)
        shell: bash
        run: |
          set -e
          cd $GITHUB_WORKSPACE/device_kernel

          TIME=$(date +"%Y%m%d%H%M%S")
          IMG=out/arch/arm64/boot/Image

          if [ ! -f "$IMG" ]; then
            echo "Image not found at $IMG. Contents of out/arch/arm64/boot:"
            ls -la out/arch/arm64/boot || true
            exit 1
          fi

          rm -rf /tmp/ak3 /tmp/ak3.zip

          if [ -f anykernel3/anykernel.sh ]; then
            # Use the AnyKernel3 folder that ships with the kernel (tuned for this device by its author)
            echo "Using anykernel3/ folder from the kernel source"
            cp -r anykernel3 /tmp/ak3
          else
            echo "No anykernel3/ in the kernel, using ${{ env.AK3_SOURCE }}"
            git clone --depth 1 ${{ env.AK3_SOURCE }} -b ${{ env.AK3_BRANCH }} /tmp/ak3
            rm -rf /tmp/ak3/.git /tmp/ak3/.github /tmp/ak3/LICENSE /tmp/ak3/README.md
            # disable device check, A12s is a non-A/B device with a normal boot partition
            sed -i -E 's/do\.devicecheck=1/do.devicecheck=0/I' /tmp/ak3/anykernel.sh
            sed -i -E 's|^BLOCK=.*|BLOCK=boot;|I; s|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|I' /tmp/ak3/anykernel.sh
          fi

          cp -f "$IMG" /tmp/ak3/Image

          (cd /tmp/ak3 && zip -r9 -q /tmp/ak3.zip ./*)

          PACK_NAME="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip"
          cp -f /tmp/ak3.zip "$PACK_NAME"
          echo "PACK_NAME=$PACK_NAME" >> $GITHUB_ENV

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
